<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 날씨 정보</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>실시간 날씨 정보</h1>
      <button id="refresh-btn" class="refresh-btn" aria-label="새로고침">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6"/><path d="M2 11.5a10 10 0 0 1 18.8-4.3L21.5 8M22 12.5a10 10 0 0 1-18.8 4.2L2.5 16"/></svg>
      </button>
    </header>

    <div id="status-banner" class="status-banner hidden"></div>

    <main class="weather-card">
      <div class="location-box">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a8 8 0 0 0-8 8c0 5.25 8 12 8 12s8-6.75 8-12a8 8 0 0 0-8-8z"/><circle cx="12" cy="10" r="3"/></svg>
        <span id="location-name">위치 확인 중...</span>
      </div>

      <div class="weather-main">
        <div id="weather-icon" class="weather-icon">☀️</div>
        <div class="temp-box">
          <span id="temp-value">--</span><span class="unit">°C</span>
        </div>
        <div id="weather-desc" class="weather-desc">데이터 로딩 중</div>
      </div>

      <div class="weather-grid">
        <div class="grid-item">
          <span class="label">습도</span>
          <span id="humidity-value" class="value">-- %</span>
        </div>
        <div class="grid-item">
          <span class="label">풍속</span>
          <span id="wind-value" class="value">-- m/s</span>
        </div>
        <div class="grid-item">
          <span class="label">1시간 강수량</span>
          <span id="rain-value" class="value">-- mm</span>
        </div>
        <div class="grid-item">
          <span class="label">격자 좌표</span>
          <span id="grid-coord" class="value">nx: --, ny: --</span>
        </div>
      </div>

      <footer class="card-footer">
        <span>기준 시각: <span id="base-datetime">--:--</span></span>
      </footer>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
